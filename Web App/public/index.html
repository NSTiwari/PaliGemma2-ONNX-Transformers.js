<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaliGemma Image Processing</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
        #imageContainer { margin-top: 20px; position: relative; display: inline-block; }
        #originalImage, #processedCanvas { max-width: 500px; margin: 20px auto; display: block; }
        #processedCanvas { position: absolute; top: 0; left: 0; pointer-events: none;}
         #responseText { margin: 20px auto; max-width: 600px; border: 1px solid #ccc; padding: 15px; text-align: left;}
         #processingMessage {margin: 10px auto; font-style: italic;}
    </style>
</head>
<body>
    <h1>Inference PaliGemma 2 with Transformer.js</h1>
    <input type="file" id="imageUpload" accept="image/*">
    <br>
    <input type="text" id="promptInput" placeholder="Enter your prompt">
    <br>
    <button id="processButton" disabled>Process Image</button>
    <button id="clearButton">Clear</button>
    <div id="processingMessage" style="display: none;">Processing...</div>


    <div id="imageContainer">
        <img id="originalImage" src="" alt="Original Image">
        <canvas id="processedCanvas" width="0" height="0"></canvas>
    </div>
    <div id="responseText" style="display: none;"></div>

     <script src="script.js"></script>
</body>
</html>
